name: Foundation checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust and native build proofs
    uses: nikolareljin/ci-helpers/.github/workflows/rust.yml@production
    with:
      concurrency_key: specter-rust
      rust_toolchain: '1.99.1'
      rust_components: rustfmt, clippy
      cache: false
      install_command: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib libc6-dev-i386 libx11-dev xvfb
        rustup target add --toolchain 1.99.1 i686-unknown-linux-gnu wasm32-unknown-unknown
      lint_command: ./dev fmt-check
      test_command: ./check
      build_command: ./dev build-i686
      e2e_command: xvfb-run -a ./dev native-proof
      timeout_minutes: 20
  web:
    name: Web interface build
    uses: nikolareljin/ci-helpers/.github/workflows/node.yml@production
    with:
      concurrency_key: specter-web
      working_directory: web
      node_version: '24'
      cache: false
      install_command: npm ci
      lint_command: ''
      test_command: ''
      build_command: npm run build
      timeout_minutes: 10
  contracts:
    name: Source contracts and documentation
    uses: nikolareljin/ci-helpers/.github/workflows/ci.yml@production
    with:
      concurrency_key: specter-contracts
      python_version: '3.12'
      cache: false
      install_command: |
        sudo apt-get update
        sudo apt-get install -y xorriso shellcheck
      lint_command: |
        bash -n dev check scripts/discover_hardware.sh
        for script in scripts/appliance/*.sh vm/*.sh; do bash -n "$script"; done
        shellcheck dev scripts/appliance/*.sh vm/*.sh
      test_command: python3 -m unittest discover -s tests -p 'test_*.py'
      extra_command: python3 scripts/check_docs.py
      timeout_minutes: 5
  gitleaks:
    name: Gitleaks
    uses: nikolareljin/ci-helpers/.github/workflows/gitleaks-scan.yml@production
    with:
      gitleaks_version: v8.30.1
      fail_on_findings: true
      upload_artifact: false
  foxguard:
    name: Foxguard
    uses: nikolareljin/ci-helpers/.github/workflows/foxguard-scan.yml@production
    with:
      foxguard_version: v0.14.1
      severity: low
      fail_on_findings: true
